# Gotcha — single-host full stack on Eskiz VPS2
# __DOMAIN__ is replaced at install time

upstream gotcha_api {
    server 127.0.0.1:3200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    server_tokens off;

    root /var/www/gotcha/public;
    index index.html;
    client_max_body_size 120m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location ^~ /api/docs {
        return 404;
    }

    location /api/v1/auth/ {
        client_max_body_size 64k;
        proxy_pass http://gotcha_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        proxy_pass http://gotcha_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /uploads/avatars/ {
        default_type application/json;
        return 401 '{"statusCode":401,"message":"Unauthorized"}';
    }

    location /uploads/ {
        alias /var/www/gotcha/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            application/pdf pdf;
            application/epub+zip epub;
        }
        default_type application/octet-stream;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        expires 1d;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        expires 1d;
    }

    # The website is not an installable app. Manifest URLs stay 404 even if an old file is still on disk.
    location = /site.webmanifest { return 404; }
    location = /learn/site.webmanifest { return 404; }

    location ~* ^/(favicon\.ico|favicon\.svg|favicon-16\.png|favicon-32\.png|favicon-192\.png|apple-touch-icon\.png|og-image\.png)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /admin/ {
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # Learner app + Telegram Mini App (/learn/tg). Telegram Web (web.telegram.org) embeds mini apps in an
    # iframe, so X-Frame-Options SAMEORIGIN would blank the app there: allow framing by Telegram only via CSP.
    # add_header in a location drops the server-level headers, so the security headers are repeated here.
    location /learn/ {
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        try_files $uri $uri/ /learn/index.html;
    }

    location / {
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
