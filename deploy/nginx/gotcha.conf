# Gotcha — single-host full stack on Eskiz VPS2
# __DOMAIN__ is replaced at install time

upstream gotcha_api {
    server 127.0.0.1:3200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/gotcha/public;
    index index.html;
    client_max_body_size 120m;

    location /api/ {
        proxy_pass http://gotcha_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        alias /var/www/gotcha/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        expires 1d;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        expires 1d;
    }

    location ~* ^/(favicon\.ico|favicon\.svg|favicon-16\.png|favicon-32\.png|favicon-192\.png|apple-touch-icon\.png|og-image\.png|site\.webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /learn/ {
        try_files $uri $uri/ /learn/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
