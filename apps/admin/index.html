<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOTCHA Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2107AA" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT@9..144,600,50&family=Literata:opsz,wght@7..72,600&family=Manrope:wght@600;700;800&family=Noto+Sans+Arabic:wght@700&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet" />
    <script>
      (function () { try { var p = localStorage.getItem('gotcha.admin.appTheme'); if (p === 'dark') localStorage.setItem('gotcha.admin.appTheme', 'system'); document.documentElement.dataset.theme = 'light'; } catch (e) {} })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
