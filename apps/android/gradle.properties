org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Dfile.encoding=UTF-8
org.gradle.vfs.watch=false
# JDK: set JAVA_HOME (or org.gradle.java.home in ~/.gradle/gradle.properties) — never a machine-specific path here.
kotlin.daemon.jvmargs=-Xmx3g
android.r8.maxMemory=2048m
android.d8.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.enableR8.fullMode=false

# QA N7: one short-lived JVM per build; avoids a stale daemon holding RAM.
org.gradle.daemon=false
