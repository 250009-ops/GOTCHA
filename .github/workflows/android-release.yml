name: Android Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/gotcha-upload.jks

      - name: Write local.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          release.storeFile=keystore/gotcha-upload.jks
          release.storePassword=${ANDROID_STORE_PASSWORD}
          release.keyAlias=${ANDROID_KEY_ALIAS}
          release.keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotcha-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
