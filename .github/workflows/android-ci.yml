name: Android CI

on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android-ci.yml']
  push:
    branches: [main, master]
    paths: ['apps/android/**', '.github/workflows/android-ci.yml']

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    env:
      VERSION_CODE: ${{ github.run_number }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Hard-coded UI literal check (M1 / UI-17)
        run: python3 i18n/check_literals.py
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: gotcha-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
